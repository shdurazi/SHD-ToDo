name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only_probe:
        description: "Run only the emulator probe (no smoke test)"
        type: boolean
        default: false

concurrency:
  # a run started by hand does not cancel the run of a push, nor the other way round
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make sure the Android SDK has what the app needs
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        id: debug
        shell: bash
        run: |
          touch build.log
          chmod +x gradlew
          ./gradlew --stacktrace --console=plain :app:assembleDebug 2>&1 | tee -a build.log

      - name: Build the release APK
        id: release
        if: steps.debug.outcome == 'success'
        shell: bash
        run: |
          ./gradlew --stacktrace --console=plain :app:assembleRelease 2>&1 | tee -a build.log

      - name: Collect the APKs
        if: steps.debug.outcome == 'success'
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ToDo-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/ToDo-release.apk
          fi
          ls -la dist

      - name: Upload the APKs
        if: steps.debug.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ToDo-apk
          path: dist/*.apk

      - name: Publish a release with the APKs
        if: steps.debug.outcome == 'success' && github.event_name != 'pull_request'
        shell: bash
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "ToDo build ${GITHUB_RUN_NUMBER}" \
            --notes "Download **ToDo-release.apk** and open it on your Android phone (allow installing from this source if asked). ToDo-debug.apk is the same app without optimisation and is only for troubleshooting." \
            --latest

      - name: Explain a failed build in a commit comment
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        run: |
          touch build.log
          {
            echo "### Build failed on ${GITHUB_SHA::7}"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "**Compiler errors**"
            echo '```'
            grep -E '^e: ' build.log | sed -E 's#file://##; s#/home/runner/work/[^/]+/[^/]+/##' | cut -c1-400 | head -n 120 || true
            echo '```'
            echo
            echo "**What went wrong**"
            echo '```'
            sed -n '/What went wrong/,/\* Try/p' build.log | cut -c1-400 | head -n 60 || true
            echo '```'
            echo
            echo "**Log tail**"
            echo '```'
            tail -n 50 build.log | cut -c1-400
            echo '```'
          } > comment.md
          head -c 60000 comment.md > comment_cut.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment_cut.md

  # Starts the freshly built APKs on an Android emulator and keeps the log and screenshots,
  # so a crash on launch shows up here instead of only on a phone.
  smoke:
    needs: build
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.only_probe) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
        # Every part of the test gets an emulator of its own: when one stops answering, the others are not lost with it.
        part: [base, overlay, a11y-debug, a11y-release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ToDo-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tools for the screenshots (ImageMagick and ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick ffmpeg > /dev/null || true

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          ram-size: 4096M
          cores: 4
          emulator-options: "-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -show-kernel -verbose > /tmp/emulator.log 2>&1"
          script: bash scripts/smoke.sh ${{ matrix.api }} ${{ matrix.part }}

      - name: Keep the logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api${{ matrix.api }}-${{ matrix.part }}
          path: smoke-out
          if-no-files-found: ignore

  # The emulators vanish (the process exits after a minute in which nothing answers) in the accessibility window's part
  # of the island test when animations are on. This job runs one scenario per leg to find out why (scripts/probe.sh).
  # It only runs when the commit message says [probe], or when it is started by hand.
  probe:
    needs: build
    if: contains(github.event.head_commit.message, '[probe]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, scenario: a11y-anim-taps, gpu: swiftshader_indirect, rep: 1 }
          - { api: 34, scenario: a11y-anim-taps-settled, gpu: swiftshader_indirect, rep: 1 }
          - { api: 34, scenario: a11y-anim-taps-notb, gpu: swiftshader_indirect, rep: 1 }
          - { api: 34, scenario: a11y-anim-taps, gpu: guest, rep: 1 }
          - { api: 34, scenario: a11y-anim-taps, gpu: swangle_indirect, rep: 1 }
          - { api: 34, scenario: overlay-anim-taps, gpu: swiftshader_indirect, rep: 1 }
          - { api: 36, scenario: a11y-anim-taps, gpu: swiftshader_indirect, rep: 1 }
          - { api: 36, scenario: a11y-anim-taps-notb, gpu: swiftshader_indirect, rep: 1 }
          - { api: 36, scenario: a11y-anim-taps, gpu: guest, rep: 1 }
          - { api: 36, scenario: a11y-anim-taps, gpu: swangle_indirect, rep: 1 }
          - { api: 36, scenario: overlay-anim-taps, gpu: swiftshader_indirect, rep: 1 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ToDo-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the scenario on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 6000M
          ram-size: 4096M
          cores: 4
          emulator-options: "-no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -show-kernel -verbose > /tmp/emulator.log 2>&1"
          pre-emulator-launch-script: bash scripts/wrap_emulator.sh
          script: bash scripts/probe.sh ${{ matrix.api }} ${{ matrix.scenario }} ${{ matrix.gpu }}

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-api${{ matrix.api }}-${{ matrix.scenario }}-${{ matrix.gpu }}-${{ matrix.rep }}
          path: smoke-out
          if-no-files-found: ignore
